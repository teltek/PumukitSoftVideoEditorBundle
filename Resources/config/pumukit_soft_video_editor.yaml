services:
  _defaults:
    autowire:      true
    autoconfigure: true
    public:        true
    bind:
      $enabled: '%pumukit_soft_video_editor.enable%'

  Pumukit\SoftVideoEditorBundle\Controller\:
    resource: '../../Controller'
    tags: ['controller.service_arguments']

  Pumukit\SoftVideoEditorBundle\Services\SoftEditingService:
    class: Pumukit\SoftVideoEditorBundle\Services\SoftEditingService

  Pumukit\SoftVideoEditorBundle\Services\AnnotationsListenerService:
    class: Pumukit\SoftVideoEditorBundle\Services\AnnotationsListenerService
    tags:
      - { name: "kernel.event_listener", event: "annotations.update", method: "onAnnotationsUpdate" }

  Pumukit\SoftVideoEditorBundle\Routing\RouteLoader:
    arguments:
      $env: '%kernel.environment%'
    tags: ['routing.loader']
